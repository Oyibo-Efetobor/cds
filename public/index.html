<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDS Attendance</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient-orb orb-a"></div>
  <div class="ambient-orb orb-b"></div>
  <div class="ambient-orb orb-c"></div>

  <div class="page">
    <main class="panel">
      <section class="hero-panel">
        <div class="hero-copy">
          <p class="section-label">Fast member check-in</p>
          <h2>Scan the session QR and submit your attendance instantly.</h2>
          <p class="section-text">This polished attendance system validates members by location and device status, then records verified check-ins only.</p>
          <div class="hero-actions" style="margin-top:24px;">
            <a href="/admin" class="button">Sign In</a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="motion-ring"></div>
          <div class="hero-metrics">
            <div class="metric-card">
              <strong>24/7</strong>
              <span>Live access</span>
            </div>
            <div class="metric-card">
              <strong>GPS-safe</strong>
              <span>Verified entry</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
